<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline · FADEEL OS</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f0e8;color:#171917;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
  .card{max-width:360px;background:#fbfaf6;border:1px solid rgba(15,17,16,.11);border-radius:18px;padding:28px;text-align:center}
  h1{font-size:20px;margin:14px 0 6px} p{color:#55574f;margin:0 0 18px}
  button{background:#ff5a1f;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff5a1f}
</style></head>
<body><div class="card"><span class="dot"></span><h1>You're offline</h1>
<p>This page hasn't been saved on this phone yet. Pages you've opened with internet (and your main pages) work offline.</p>
<button onclick="location.reload()">Try again</button></div></body></html>
